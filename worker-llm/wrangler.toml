name = "smart-entry-llm"
main = "llm-proxy.js"
compatibility_date = "2024-11-01"

# 非敏感配置写这里；密钥不要写！用命令行加密设置（见 README.md）：
#   npx wrangler secret put LLM_API_KEY
[vars]
LLM_PROVIDER = "deepseek"      # deepseek | openai | kimi | qwen | zhipu | anthropic | custom
# LLM_MODEL  = "deepseek-chat" # 可选：默认模型（前端没传时用）
# LLM_BASE_URL = ""            # 可选：provider=custom 时填你的 OpenAI 兼容端点
# ALLOW_ORIGIN = "https://sjians.github.io"   # 可选：收紧 CORS 到你的页面域名（默认 *）
# APP_TOKEN 走 secret（可选防滥用）：npx wrangler secret put APP_TOKEN
