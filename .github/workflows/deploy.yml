# 自动部署到 GitHub Pages
# 触发：每次 push 到 main 分支（也可在 Actions 页面手动触发）
# 流程：安装依赖 → vite 打包 → 上传 dist/ → 发布到 Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# 授予工作流发布 Pages 所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个发布，新提交自动取消进行中的旧发布
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
